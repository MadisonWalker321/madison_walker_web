- role: "SPARK Research Intern"
  org: "Harvard & Smithsonian Center for Astrophysics (CfA)"
  place: "Cambridge, MA"
  dates: "September 2026–Present"
  text: "I investigate potential planetary-mass companions in JWST MIRI direct-imaging observations of the circumbinary system QY Aur. I process observational data using reference differential imaging (RDI) and principal component analysis (PCA) to suppress stellar flux and identify potential companions. I also developed a proposal for JWST follow-up observations to conduct proper-motion verification and assess the validity of candidate companions. A first-author research paper is in preparation."
- role: "Science Intern"
  org: "Las Cumbres Observatory (LCO)"
  place: "Goleta, CA"
  dates: "June–August 2026"
  text: "I coordinated and executed observations of the binary asteroid system Didymos using the 2-meter telescope at Siding Spring Observatory through the LCO Robotic Telescope Network. I applied Differential Imaging Analysis to extract light curves and constrain the orbital parameters of the eclipsing binary in support of ESA’s Hera follow-up mission to NASA’s DART planetary defense mission. I also developed a Python wrapper for photometric data extraction and conducted photometric error analysis for quality control, identifying instrumentation issues and data-reduction pipeline failures."
- role: "Undergraduate Research Intern"
  org: "Mazin Lab, University of California, Santa Barbara"
  place: "Santa Barbara, CA"
  dates: "April 2024–June 2026"
  text: "Under the supervision of Dr. Ben Mazin, I conducted high-contrast direct-imaging analysis of the K-dwarf system HIP 38514 using observations from the Subaru Telescope’s Microwave Kinetic Inductance Detector (MKID) instrumentation integrated with the Subaru Coronagraphic Extreme Adaptive Optics (SCExAO) system, as well as the Coronagraphic High Angular Resolution Imaging Spectrograph (CHARIS). I applied angular and spectral differential imaging (ADI/SDI) techniques using pyKLIP for point-spread function subtraction, developed Python scripts for satellite spot detection and image calibration, and extracted the companion’s spectrum for comparison with known M- and L-type stellar spectra. I also used Orvara, a Markov Chain Monte Carlo (MCMC) orbital-fitting program, to determine the dynamical mass of the companion HIP 38514 b."
